# Security module — English (source of truth).
#
# The keys here are split into three blocks:
#   1. `email.*` — the lifecycle email templates (subject + body strings).
#   2. `login.*` / `confirm.*` / `invalid_link.*` — the public auth flow.
#   3. `permission.*` — labels + descriptions for every PERMISSION_*
#      constant, used by the role/permission admin forms and the
#      permission catalog.
#
# The `home.*` keys are kept for users who override HomeController to
# ship a public homepage; the skeleton ships HomeController as a redirect
# to /login.
#
# `messages.es.yaml` is the matching translation; missing keys fall back
# to English automatically (Symfony's `fallbacks: ['en']`).

# ── Lifecycle emails ────────────────────────────────────────────────
email:
    confirmation:
        subject: 'Welcome — set your password'
        greeting: 'Hello %name%,'
        intro: 'An administrator created an account for you on KTN Gestión. Click the button below to set your password and activate your account.'
        cta: 'Set my password'
        expires: 'This link expires in %hours% hours.'
        ignore: 'If you did not expect this email, you can safely ignore it.'
    activated:
        subject: 'Your KTN Gestión account is active'
        body: 'Hello %name%, your account is now active. You can sign in from the backoffice login page.'
    disabled:
        subject: 'Your KTN Gestión account has been disabled'
        body: 'Hello %name%, an administrator has disabled your KTN Gestión account.'
        reason: 'Reason given: %reason%'

# ── Public homepage (optional — only if a downstream project overrides HomeController) ─
home:
    title: 'KTN Gestión — Home'
    heading: 'KTN Gestión'
    subtitle: 'Backoffice online — Apache ✓ Twig ✓ Vite HMR ✓ Tailwind ✓'

# ── Login page (/login) ──────────────────────────────────────────────
login:
    page_title: 'Sign in — KTN Gestión'
    brand_subtitle: 'Sign in to the backoffice'
    email: 'Email'
    password: 'Password'
    submit: 'Sign in'
    invalid: 'Invalid email or password.'
    signup_hint: 'Accounts are created by an administrator.'
    signup_hint_line2: 'Contact your admin if you need access.'

# ── Confirmation page (/account/confirm) ─────────────────────────────
confirm:
    page_title: 'Set your password — KTN Gestión'
    heading: 'Set your password'
    welcome: 'Welcome, %name%'
    submit: 'Activate my account'
    activation_failed: 'Your account could not be activated. Please contact your administrator.'
    success: 'Password set. You can now sign in.'

# ── Invalid / expired link page (/account/confirm) ──────────────────
invalid_link:
    page_title: 'Invalid link — KTN Gestión'
    heading: 'Invalid or expired link'
    expired: 'This invitation link is invalid, has expired, or has already been used.'
    no_longer_pending: 'Your account is no longer awaiting activation. An administrator may have disabled it.'
    contact_admin: 'Please contact the administrator who created your account and ask them to send a new invitation.'

# ── Permission catalog (label + description per PERMISSION_*) ────────
# Used by RoleType::permissions' choice_label closure, the info-icon
# tooltip in the role form, and the permission catalog page. The keys
# MUST be the exact PERMISSION_* constant names
# (App\Security\Permission::groups()).
permission:
    PERMISSION_VIEW_BACKOFFICE:
        label: 'View backoffice'
        description: 'Access the backoffice dashboard. Without this permission the user cannot reach /dashboard.'
    PERMISSION_MANAGE_USERS:
        label: 'Manage users'
        description: 'Create, edit, disable, and delete user accounts; re-send confirmation emails.'
    PERMISSION_MANAGE_ROLES:
        label: 'Manage roles'
        description: 'Create, edit, and delete roles and their permission grants.'
    PERMISSION_MANAGE_PERMISSIONS:
        label: 'Manage permissions'
        description: 'Browse the permission catalog. Roles and permissions are seeded; this view is read-only.'
    PERMISSION_IMPERSONATE_USERS:
        label: 'Impersonate users'
        description: 'Log in as another user for support purposes. Audit-logged; cannot be used admin-to-admin.'

# ── Permission module groups (used by the catalog page and the role
# form's grouped permission picker). Add a key here whenever you add a
# module to App\Security\Permission::groups().
permission_group:
    admin:
        label: 'Admin'
    administration:
        label: 'Administration'
    backoffice:
        label: 'Backoffice'
    other:
        label: 'Other'
