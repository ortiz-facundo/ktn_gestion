# Security module — Español (tuteo).
# Véase `messages.en.yaml` para el contexto. Las claves que falten
# caen al inglés automáticamente (fallback de Symfony).

# ── Correos de ciclo de vida ────────────────────────────────────────
email:
    confirmation:
        subject: 'Bienvenido — define tu contraseña'
        greeting: 'Hola %name%,'
        intro: 'Un administrador creó una cuenta para ti en KTN Gestión. Haz clic en el botón de abajo para definir tu contraseña y activar tu cuenta.'
        cta: 'Definir mi contraseña'
        expires: 'Este enlace caduca en %hours% horas.'
        ignore: 'Si no esperabas este correo, puedes ignorarlo sin problema.'
    activated:
        subject: 'Tu cuenta de KTN Gestión está activa'
        body: 'Hola %name%, tu cuenta ya está activa. Puedes iniciar sesión desde la página de acceso al panel.'
    disabled:
        subject: 'Tu cuenta de KTN Gestión ha sido deshabilitada'
        body: 'Hola %name%, un administrador ha deshabilitado tu cuenta de KTN Gestión.'
        reason: 'Motivo indicado: %reason%'

# ── Página de inicio pública (opcional — sólo si un proyecto downstream reemplaza HomeController) ─
home:
    title: 'KTN Gestión — Inicio'
    heading: 'KTN Gestión'
    subtitle: 'Panel en línea — Apache ✓ Twig ✓ Vite HMR ✓ Tailwind ✓'

# ── Página de inicio de sesión (/login) ─────────────────────────────
login:
    page_title: 'Iniciar sesión — KTN Gestión'
    brand_subtitle: 'Inicia sesión en el panel'
    email: 'Correo electrónico'
    password: 'Contraseña'
    submit: 'Iniciar sesión'
    invalid: 'Correo electrónico o contraseña no válidos.'
    signup_hint: 'Las cuentas son creadas por un administrador.'
    signup_hint_line2: 'Contacta a tu administrador si necesitas acceso.'

# ── Página de confirmación (/account/confirm) ──────────────────────
confirm:
    page_title: 'Define tu contraseña — KTN Gestión'
    heading: 'Define tu contraseña'
    welcome: 'Bienvenido, %name%'
    submit: 'Activar mi cuenta'
    activation_failed: 'No se pudo activar tu cuenta. Por favor, contacta a tu administrador.'
    success: 'Contraseña definida. Ya puedes iniciar sesión.'

# ── Página de enlace inválido (/account/confirm) ────────────────────
invalid_link:
    page_title: 'Enlace no válido — KTN Gestión'
    heading: 'Enlace no válido o caducado'
    expired: 'Este enlace de invitación no es válido, ha caducado o ya ha sido utilizado.'
    no_longer_pending: 'Tu cuenta ya no está esperando activación. Es posible que un administrador la haya deshabilitado.'
    contact_admin: 'Por favor, contacta al administrador que creó tu cuenta y pídele que te envíe una nueva invitación.'

# ── Catálogo de permisos ────────────────────────────────────────────
permission:
    PERMISSION_VIEW_BACKOFFICE:
        label: 'Ver el panel'
        description: 'Acceder al panel de administración. Sin este permiso el usuario no puede llegar a /dashboard.'
    PERMISSION_MANAGE_USERS:
        label: 'Administrar usuarios'
        description: 'Crear, editar, deshabilitar y eliminar cuentas de usuario; reenviar correos de confirmación.'
    PERMISSION_MANAGE_ROLES:
        label: 'Administrar roles'
        description: 'Crear, editar y eliminar roles y sus asignaciones de permisos.'
    PERMISSION_MANAGE_PERMISSIONS:
        label: 'Administrar permisos'
        description: 'Consultar el catálogo de permisos. Los roles y permisos se crean desde el seed; esta vista es de solo lectura.'
    PERMISSION_IMPERSONATE_USERS:
        label: 'Suplantar usuarios'
        description: 'Iniciar sesión como otro usuario para soporte. Queda registrado en auditoría; no se permite entre administradores.'

# ── Módulos del catálogo de permisos (usados por la página del
# catálogo y por el selector agrupado de permisos en el formulario de
# rol). Añade una clave aquí cada vez que añadas un módulo a
# App\Security\Permission::groups().
permission_group:
    admin:
        label: 'Administración'
    administration:
        label: 'Gestión de usuarios y roles'
    backoffice:
        label: 'Panel'
    other:
        label: 'Otros'
