name: ktn_gestion

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktn_gestion-php
    ports:
      - "8070:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://app:!ChangeMe!@database:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
      APP_ENV: dev
      APP_DEBUG: 1

  database:
    image: mariadb:10.11
    container_name: ktn_gestion-db
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: "!ChangeMe!"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  composer:
    image: composer:2
    container_name: ktn_gestion-composer
    volumes:
      - ./:/app
    working_dir: /app
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"

volumes:
  db_data:
